server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA configuration - redirect all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache control for static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
    }
}
